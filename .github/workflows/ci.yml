name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Build, lint, and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --workspace --all-targets
      - name: Lint production targets
        run: >-
          cargo clippy --workspace --lib --bins --
          -D warnings
          -A clippy::large-enum-variant
          -A clippy::expect-used
      - name: Run workspace tests
        run: cargo test --workspace

  typescript-sdk:
    name: TypeScript SDK (arm64)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          cache: true
          cache_dependency_path: sdks/typescript/pnpm-lock.yaml
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Require arm64 runner
        run: test "$(uname -m)" = arm64
      - name: Install dependencies
        working-directory: sdks/typescript
        run: pnpm install --frozen-lockfile
      - name: Build native writer
        working-directory: sdks/typescript
        run: pnpm run build:native
      - name: Test SDK
        working-directory: sdks/typescript
        run: |
          pnpm test
          pnpm run test:native

  python-sdk:
    name: Python SDK (arm64)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.5"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: sdks/python/uv.lock
      - name: Require arm64 runner
        run: test "$(uname -m)" = arm64
      - name: Build and install SDK
        run: uv sync --project sdks/python --locked
      - name: Test SDK
        run: uv run --project sdks/python --locked python -m unittest discover -s sdks/python/tests -v
