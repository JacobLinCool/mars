name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Build, lint, and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --workspace --all-targets
      - name: Lint production targets
        run: >-
          cargo clippy --workspace --lib --bins --
          -D warnings
          -A clippy::large-enum-variant
          -A clippy::expect-used
      - name: Run workspace tests
        run: cargo test --workspace

  typescript-sdk:
    name: TypeScript SDK (arm64)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: Require arm64 runner
        run: test "$(uname -m)" = arm64
      - name: Install dependencies
        working-directory: sdks/typescript
        run: npm ci
      - name: Build native writer
        working-directory: sdks/typescript
        run: npm run build:native
      - name: Test SDK
        working-directory: sdks/typescript
        run: |
          npm test
          npm run test:native

  python-sdk:
    name: Python SDK (arm64)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml
      - name: Require arm64 runner
        run: test "$(uname -m)" = arm64
      - name: Build and install SDK
        run: python -m pip install ./sdks/python
      - name: Test SDK
        run: python -m unittest discover -s sdks/python/tests -v
