name: Notarized Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release tag
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Require a version-matched tag on main
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/mars-daemon/Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          for manifest in \
            crates/mars-cli/Cargo.toml \
            crates/mars-hal/Cargo.toml \
            crates/mars-sdk/Cargo.toml \
            crates/mars-sdk-node/Cargo.toml \
            crates/mars-sdk-python/Cargo.toml
          do
            MANIFEST_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest" | head -1)"
            test "$MANIFEST_VERSION" = "$VERSION"
          done
          TYPESCRIPT_VERSION="$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)",/\1/p' sdks/typescript/package.json | head -1)"
          PYTHON_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' sdks/python/pyproject.toml | head -1)"
          test "$TYPESCRIPT_VERSION" = "$VERSION"
          test "$PYTHON_VERSION" = "$VERSION"
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --workspace --all-targets
      - name: Lint production targets
        run: >-
          cargo clippy --workspace --lib --bins --
          -D warnings
          -A clippy::large-enum-variant
          -A clippy::expect-used
      - name: Run workspace tests
        run: cargo test --workspace

  build:
    name: Build and notarize (arm64)
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate release credentials
        env:
          APPLICATION_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          INSTALLER_CERTIFICATE: ${{ secrets.DEVELOPER_ID_INSTALLER_CERT_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          for name in \
            APPLICATION_CERTIFICATE \
            APPLICATION_CERTIFICATE_PASSWORD \
            INSTALLER_CERTIFICATE \
            INSTALLER_CERTIFICATE_PASSWORD \
            NOTARY_KEY \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID
          do
            if [ -z "${!name}" ]; then
              echo "Missing required release secret: $name" >&2
              exit 1
            fi
          done
      - name: Import Developer ID certificates
        env:
          APPLICATION_CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          INSTALLER_CERTIFICATE: ${{ secrets.DEVELOPER_ID_INSTALLER_CERT_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/mars-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$APPLICATION_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/application.p12"
          printf '%s' "$INSTALLER_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/installer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/application.p12" -k "$KEYCHAIN_PATH" -P "$APPLICATION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN_PATH" -P "$INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/pkgbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v "$KEYCHAIN_PATH"
      - name: Write App Store Connect API key
        env:
          NOTARY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_KEY" | base64 -D > "$NOTARY_KEY_PATH"
          chmod 0600 "$NOTARY_KEY_PATH"
          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"
      - name: Build signed installer
        run: scripts/package-installer.sh
      - name: Notarize and staple installer
        env:
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          PACKAGE="$(find dist -maxdepth 1 -name 'mars-*-arm64.pkg' -print -quit)"
          test -n "$PACKAGE"
          RESULT="$RUNNER_TEMP/notary-result-arm64.json"
          LOG="$RUNNER_TEMP/notary-log-arm64.json"
          xcrun notarytool submit "$PACKAGE" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$RESULT"
          cat "$RESULT"
          jq -e '.status == "Accepted"' "$RESULT"
          SUBMISSION_ID="$(jq -r '.id' "$RESULT")"
          xcrun notarytool log "$SUBMISSION_ID" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            "$LOG"
          jq -e '([.issues[]? | select(.severity == "error")] | length) == 0' "$LOG"
          xcrun stapler staple "$PACKAGE"
          xcrun stapler validate "$PACKAGE"
          spctl --assess --type install --verbose=4 "$PACKAGE"
          (
            cd "$(dirname "$PACKAGE")"
            shasum -a 256 "$(basename "$PACKAGE")"
          ) > "$PACKAGE.sha256"
          cp "$RESULT" "$PACKAGE.notary-result.json"
          cp "$LOG" "$PACKAGE.notary-log.json"
      - name: Upload notarized installer
        uses: actions/upload-artifact@v7
        with:
          name: mars-release-arm64
          path: |
            dist/mars-*-arm64.pkg
            dist/mars-*-arm64.pkg.sha256
            dist/mars-*-arm64.pkg.notary-result.json
            dist/mars-*-arm64.pkg.notary-log.json
          if-no-files-found: error

  language-sdks:
    name: Build and verify language SDKs (arm64)
    needs: verify
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          cache: true
          cache_dependency_path: sdks/typescript/pnpm-lock.yaml
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: sdks/python/uv.lock
      - name: Require arm64 runner
        run: test "$(uname -m)" = arm64
      - name: Test TypeScript SDK
        working-directory: sdks/typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:native
          pnpm test
          pnpm run test:native
          mkdir -p "$GITHUB_WORKSPACE/dist/sdk-npm"
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist/sdk-npm"
      - name: Test Python SDK
        run: |
          uv sync --project sdks/python --locked
          uv run --project sdks/python --locked python -m unittest discover -s sdks/python/tests -v
          uv build --project sdks/python --python 3.11 --wheel --clear --out-dir dist/sdk-pypi
          WHEEL="$(find dist/sdk-pypi -maxdepth 1 -name 'mars_sdk-*-cp311-abi3-macosx_11_0_arm64.whl' -print -quit)"
          test -n "$WHEEL"
          uv run --isolated --python 3.11 --with "$WHEEL" python -c 'import mars_sdk; print(mars_sdk.__name__)'
      - name: Upload npm package
        uses: actions/upload-artifact@v7
        with:
          name: mars-sdk-npm
          path: dist/sdk-npm/*.tgz
          if-no-files-found: error
      - name: Upload PyPI package
        uses: actions/upload-artifact@v7
        with:
          name: mars-sdk-pypi
          path: dist/sdk-pypi/*.whl
          if-no-files-found: error

  publish-npm:
    name: Publish TypeScript SDK to npm
    needs:
      - build
      - language-sdks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mars-sdk-npm
          path: package
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish package with npm trusted publishing
        run: |
          PACKAGE="$(find package -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$PACKAGE"
          pnpm dlx npm@11.10.0 publish "$PACKAGE" --access public

  publish-pypi:
    name: Publish Python SDK to PyPI
    needs:
      - build
      - language-sdks
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mars-sdk-pypi
          path: package
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          enable-cache: false
      - name: Publish package with PyPI trusted publishing
        run: uv publish --trusted-publishing always package/*.whl

  publish:
    name: Publish GitHub Release
    needs:
      - build
      - language-sdks
      - publish-npm
      - publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mars-release-arm64
          path: release
      - name: Verify release assets
        run: |
          test "$(find release -maxdepth 1 -name '*.pkg' | wc -l)" -eq 1
          cd release
          sha256sum --check ./*.pkg.sha256
          sha256sum ./*.pkg > SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(release/*.pkg release/*.pkg.sha256 release/*.pkg.notary-result.json release/*.pkg.notary-log.json release/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --verify-tag \
              --generate-notes \
              --title "MARS $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
