[package]
name = "mars-sdk-python"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Native data-plane binding for the MARS Python SDK"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module", "pyo3/abi3-py311"]

[dependencies]
mars-sdk = { path = "../mars-sdk" }
mars-types = { path = "../mars-types" }
pyo3 = "0.29.2"
serde_json.workspace = true

[lints]
workspace = true
