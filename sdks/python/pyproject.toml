[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mars-audio-sdk"
version = "0.1.0"
description = "Python SDK for app-owned MARS virtual inputs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.maturin]
manifest-path = "../../crates/mars-sdk-python/Cargo.toml"
python-source = "src"
module-name = "mars_sdk._native"
features = ["extension-module"]
