[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "mars-audio-sdk"
version = "0.1.0"
description = "Python SDK for app-owned MARS virtual inputs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/JacobLinCool/mars"
Repository = "https://github.com/JacobLinCool/mars"
Issues = "https://github.com/JacobLinCool/mars/issues"

[tool.maturin]
manifest-path = "../../crates/mars-sdk-python/Cargo.toml"
python-source = "src"
module-name = "mars_sdk._native"
features = ["extension-module"]
